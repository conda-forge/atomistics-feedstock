schema_version: 1

context:
  name: atomistics
  version: 0.4.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/atomistics-${{ version }}.tar.gz
  sha256: 9d9ceb188e1ad6ab3c6e700550eab5591892ce1f0944b2161b66b7aadd2c950c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - ase
    - numpy
    - scipy
    - spglib
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - ase >=3.23.0,<3.30.0
    - numpy >=1.26.4,<2.6.0
    - scipy >=1.11.2,<1.19.0
    - spglib >=2.0.2,<2.8.0
tests:
  - python:
      imports:
        - atomistics
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: atomistics - materials science workgflows to calculate material properties
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/atomistics

extra:
  recipe-maintainers:
    - pyiron-runner
    - jan-janssen
